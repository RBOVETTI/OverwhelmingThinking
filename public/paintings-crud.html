<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paintings JSON Editor</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f4ef;
        --panel: #ffffff;
        --ink: #1f2328;
        --muted: #667085;
        --line: #d9d6cf;
        --accent: #0b6b62;
        --accent-dark: #084b45;
        --danger: #a73535;
        --shadow: 0 12px 32px rgba(31, 35, 40, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: var(--accent);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .app {
        width: min(1480px, 100%);
        margin: 0 auto;
        padding: 20px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: end;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 26px;
        line-height: 1.15;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .file-actions,
      .record-actions,
      .nav-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .primary:hover:not(:disabled) {
        border-color: var(--accent-dark);
        background: var(--accent-dark);
      }

      .danger {
        border-color: rgba(167, 53, 53, 0.32);
        color: var(--danger);
      }

      .icon-button {
        width: 42px;
        padding: 0;
        font-size: 24px;
        line-height: 1;
      }

      .status-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }

      .status {
        min-height: 34px;
        display: flex;
        align-items: center;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        font-size: 13px;
      }

      .dirty {
        color: var(--accent-dark);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 46%) minmax(360px, 1fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .image-panel {
        position: sticky;
        top: 16px;
        overflow: hidden;
      }

      .preview-wrap {
        display: grid;
        min-height: 520px;
        place-items: center;
        background: #ede9df;
      }

      .preview-wrap img {
        display: block;
        width: 100%;
        max-height: 76vh;
        object-fit: contain;
      }

      .empty-preview {
        width: 100%;
        padding: 32px;
        text-align: center;
        color: var(--muted);
      }

      .image-meta {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }

      .record-heading {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
      }

      .record-title {
        min-width: 0;
      }

      .record-title strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 18px;
      }

      .record-title span {
        color: var(--muted);
        font-size: 13px;
      }

      .form-panel {
        padding: 16px;
      }

      .finder {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) minmax(220px, 1.3fr);
        gap: 10px;
        margin-bottom: 14px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 5px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
      }

      input,
      select {
        height: 40px;
        padding: 0 10px;
      }

      textarea {
        min-height: 140px;
        resize: vertical;
        padding: 10px;
        line-height: 1.45;
      }

      input:focus,
      textarea:focus,
      select:focus,
      button:focus-visible {
        outline: 2px solid rgba(11, 107, 98, 0.28);
        outline-offset: 2px;
      }

      .validation {
        display: none;
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid rgba(167, 53, 53, 0.28);
        border-radius: 6px;
        background: #fff5f5;
        color: var(--danger);
        font-size: 13px;
      }

      .validation.is-visible {
        display: block;
      }

      .validation ul {
        margin: 6px 0 0;
        padding-left: 20px;
      }

      .image-link {
        color: var(--accent-dark);
        font-size: 13px;
        text-decoration: none;
      }

      .image-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 920px) {
        .app {
          padding: 14px;
        }

        .topbar,
        .status-row,
        .layout,
        .record-heading,
        .finder,
        .field-grid {
          grid-template-columns: 1fr;
        }

        .image-panel {
          position: static;
        }

        .preview-wrap {
          min-height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Paintings JSON Editor</h1>
          <p class="subtitle">Editor locale per modificare un record alla volta con anteprima immagine.</p>
        </div>
        <div class="file-actions">
          <button type="button" id="openFileBtn" class="primary">Apri JSON</button>
          <button type="button" id="saveFileBtn" disabled>Salva JSON</button>
          <button type="button" id="downloadFileBtn" disabled>Scarica copia</button>
          <input type="file" id="fileInput" accept="application/json,.json" hidden />
        </div>
      </header>

      <section class="status-row" aria-live="polite">
        <div id="status" class="status">Nessun file caricato.</div>
        <div class="record-actions">
          <button type="button" id="newBtn" disabled>Nuovo</button>
          <button type="button" id="duplicateBtn" disabled>Duplica</button>
          <button type="button" id="deleteBtn" class="danger" disabled>Elimina</button>
        </div>
      </section>

      <section class="layout">
        <aside class="panel image-panel">
          <div class="preview-wrap">
            <img id="previewImage" alt="" hidden />
            <div id="emptyPreview" class="empty-preview">Carica Paintings.json per iniziare.</div>
          </div>
          <div class="image-meta">
            <div class="record-heading">
              <div class="record-title">
                <strong id="recordTitle">Nessun record</strong>
                <span id="recordMeta">0 / 0</span>
              </div>
              <div class="nav-actions">
                <button type="button" id="prevBtn" class="icon-button" aria-label="Opera precedente" disabled>&lsaquo;</button>
                <button type="button" id="nextBtn" class="icon-button" aria-label="Opera successiva" disabled>&rsaquo;</button>
              </div>
            </div>
            <a id="imageLink" class="image-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Apri immagine</a>
          </div>
        </aside>

        <section class="panel form-panel">
          <div class="finder">
            <div class="field">
              <label for="searchInput">Cerca</label>
              <input id="searchInput" type="search" placeholder="ID, titolo, categoria, immagine" disabled />
            </div>
            <div class="field">
              <label for="recordSelect">Record</label>
              <select id="recordSelect" disabled></select>
            </div>
          </div>

          <form id="editorForm" class="field-grid">
            <div class="field">
              <label for="id">ID</label>
              <input id="id" name="id" type="number" min="1" inputmode="numeric" disabled />
            </div>
            <div class="field">
              <label for="publicationDate">Data pubblicazione</label>
              <input id="publicationDate" name="publicationDate" type="date" disabled />
            </div>
            <div class="field">
              <label for="category">Categoria</label>
              <select id="category" name="category" disabled></select>
            </div>
            <div class="field">
              <label for="price">Prezzo</label>
              <select id="price" name="price" disabled></select>
            </div>
            <div class="field">
              <label for="dimensions">Dimensioni</label>
              <input id="dimensions" name="dimensions" type="text" list="dimensionsOptions" disabled />
            </div>
            <div class="field">
              <label for="image">Immagine</label>
              <input id="image" name="image" type="text" list="imageOptions" disabled />
            </div>
            <div class="field">
              <label for="titleIt">Titolo IT</label>
              <input id="titleIt" name="titleIt" type="text" disabled />
            </div>
            <div class="field">
              <label for="titleEn">Titolo EN</label>
              <input id="titleEn" name="titleEn" type="text" disabled />
            </div>
            <div class="field">
              <label for="techniqueIt">Tecnica IT</label>
              <input id="techniqueIt" name="techniqueIt" type="text" list="techniqueItOptions" disabled />
            </div>
            <div class="field">
              <label for="techniqueEn">Tecnica EN</label>
              <input id="techniqueEn" name="techniqueEn" type="text" list="techniqueEnOptions" disabled />
            </div>
            <div class="field full">
              <label for="descriptionIt">Descrizione IT</label>
              <textarea id="descriptionIt" name="descriptionIt" disabled></textarea>
            </div>
            <div class="field full">
              <label for="descriptionEn">Descrizione EN</label>
              <textarea id="descriptionEn" name="descriptionEn" disabled></textarea>
            </div>
          </form>

          <datalist id="dimensionsOptions"></datalist>
          <datalist id="imageOptions"></datalist>
          <datalist id="techniqueItOptions"></datalist>
          <datalist id="techniqueEnOptions"></datalist>

          <div id="validation" class="validation"></div>
        </section>
      </section>
    </main>

    <script src="paintings-crud-core.js"></script>
    <script>
      const core = window.PaintingsCrudCore;

      const els = {
        openFileBtn: document.getElementById('openFileBtn'),
        saveFileBtn: document.getElementById('saveFileBtn'),
        downloadFileBtn: document.getElementById('downloadFileBtn'),
        fileInput: document.getElementById('fileInput'),
        status: document.getElementById('status'),
        newBtn: document.getElementById('newBtn'),
        duplicateBtn: document.getElementById('duplicateBtn'),
        deleteBtn: document.getElementById('deleteBtn'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        searchInput: document.getElementById('searchInput'),
        recordSelect: document.getElementById('recordSelect'),
        editorForm: document.getElementById('editorForm'),
        previewImage: document.getElementById('previewImage'),
        emptyPreview: document.getElementById('emptyPreview'),
        recordTitle: document.getElementById('recordTitle'),
        recordMeta: document.getElementById('recordMeta'),
        imageLink: document.getElementById('imageLink'),
        validation: document.getElementById('validation'),
      };

      const choiceDefaults = {
        category: ['Cows and Bulls', 'Semi Abstract', 'Photos'],
        price: ['100€', 'SOLD', 'NON DISPONIBILE', 'DISTRUTTO'],
      };

      const fields = {
        id: document.getElementById('id'),
        publicationDate: document.getElementById('publicationDate'),
        category: document.getElementById('category'),
        price: document.getElementById('price'),
        dimensions: document.getElementById('dimensions'),
        image: document.getElementById('image'),
        titleIt: document.getElementById('titleIt'),
        titleEn: document.getElementById('titleEn'),
        techniqueIt: document.getElementById('techniqueIt'),
        techniqueEn: document.getElementById('techniqueEn'),
        descriptionIt: document.getElementById('descriptionIt'),
        descriptionEn: document.getElementById('descriptionEn'),
      };

      const datalists = {
        dimensions: document.getElementById('dimensionsOptions'),
        image: document.getElementById('imageOptions'),
        techniqueIt: document.getElementById('techniqueItOptions'),
        techniqueEn: document.getElementById('techniqueEnOptions'),
      };

      let paintings = [];
      let currentIndex = -1;
      let visibleIndexes = [];
      let fileHandle = null;
      let fileName = 'Paintings.json';
      let dirty = false;
      let rendering = false;

      if (!core) {
        setStatus('Errore: paintings-crud-core.js non caricato.', true);
      }

      function setStatus(message, isError) {
        els.status.textContent = message;
        els.status.classList.toggle('dirty', Boolean(dirty && !isError));
        els.status.style.color = isError ? 'var(--danger)' : '';
      }

      function setDirty(value) {
        dirty = value;
        if (paintings.length) {
          setStatus(`${fileName} - ${paintings.length} record${dirty ? ' - modifiche non salvate' : ''}.`);
        }
      }

      function setEnabled(enabled) {
        [
          els.saveFileBtn,
          els.downloadFileBtn,
          els.newBtn,
          els.duplicateBtn,
          els.deleteBtn,
          els.prevBtn,
          els.nextBtn,
          els.searchInput,
          els.recordSelect,
          ...Object.values(fields),
        ].forEach((element) => {
          element.disabled = !enabled;
        });
      }

      function fieldValues() {
        return Object.fromEntries(
          Object.entries(fields).map(([name, field]) => [name, field.value])
        );
      }

      function writeFieldValues(values) {
        rendering = true;
        Object.entries(fields).forEach(([name, field]) => {
          field.value = values[name] || '';
        });
        rendering = false;
      }

      function renderSelectOptions(select, options, placeholder) {
        const currentValue = select.value;
        select.innerHTML = '';

        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = placeholder;
        select.appendChild(emptyOption);

        options.forEach((value) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          select.appendChild(option);
        });

        if (currentValue && !options.includes(currentValue)) {
          const currentOption = document.createElement('option');
          currentOption.value = currentValue;
          currentOption.textContent = currentValue;
          select.appendChild(currentOption);
        }

        select.value = currentValue;
      }

      function renderDatalistOptions(datalist, options) {
        datalist.innerHTML = '';
        options.forEach((value) => {
          const option = document.createElement('option');
          option.value = value;
          datalist.appendChild(option);
        });
      }

      function renderChoiceControls() {
        renderSelectOptions(
          fields.category,
          core.valueOptionsForField(paintings, 'category', choiceDefaults.category),
          'Seleziona categoria'
        );
        renderSelectOptions(
          fields.price,
          core.valueOptionsForField(paintings, 'price', choiceDefaults.price),
          'Seleziona prezzo'
        );
        renderDatalistOptions(datalists.dimensions, core.valueOptionsForField(paintings, 'dimensions'));
        renderDatalistOptions(datalists.image, core.valueOptionsForField(paintings, 'image'));
        renderDatalistOptions(datalists.techniqueIt, core.valueOptionsForField(paintings, 'techniqueIt'));
        renderDatalistOptions(datalists.techniqueEn, core.valueOptionsForField(paintings, 'techniqueEn'));
      }

      function applyCurrentForm() {
        if (currentIndex < 0 || !paintings[currentIndex]) {
          return;
        }
        paintings[currentIndex] = core.formValuesToPainting(fieldValues(), paintings[currentIndex]);
        setDirty(true);
      }

      function currentPainting() {
        return currentIndex >= 0 ? paintings[currentIndex] : null;
      }

      function renderRecordOptions() {
        visibleIndexes = core.filterPaintingIndexes(paintings, els.searchInput.value);
        els.recordSelect.innerHTML = '';

        visibleIndexes.forEach((index) => {
          const painting = paintings[index];
          const option = document.createElement('option');
          option.value = String(index);
          option.textContent = `${painting.id || '?'} - ${painting.title.it || '(senza titolo)'}`;
          els.recordSelect.appendChild(option);
        });

        if (visibleIndexes.length && !visibleIndexes.includes(currentIndex)) {
          currentIndex = visibleIndexes[0];
        }
        if (!visibleIndexes.length) {
          currentIndex = paintings.length ? currentIndex : -1;
        }
        if (currentIndex >= 0) {
          els.recordSelect.value = String(currentIndex);
        }
      }

      function renderPreview(painting) {
        const imagePath = painting && painting.image ? painting.image : '';
        if (!imagePath) {
          els.previewImage.hidden = true;
          els.previewImage.removeAttribute('src');
          els.emptyPreview.hidden = false;
          els.emptyPreview.textContent = paintings.length ? 'Nessuna immagine impostata.' : 'Carica Paintings.json per iniziare.';
          els.imageLink.hidden = true;
          return;
        }

        els.previewImage.hidden = false;
        els.previewImage.src = imagePath;
        els.previewImage.alt = painting.title.it || `Opera ${painting.id || ''}`;
        els.emptyPreview.hidden = true;
        els.imageLink.href = imagePath;
        els.imageLink.textContent = imagePath;
        els.imageLink.hidden = false;
      }

      function renderValidation(errors) {
        if (!errors.length) {
          els.validation.classList.remove('is-visible');
          els.validation.innerHTML = '';
          return;
        }

        els.validation.innerHTML = `<strong>Controlla prima di salvare:</strong><ul>${errors
          .map((error) => `<li>${escapeHtml(error)}</li>`)
          .join('')}</ul>`;
        els.validation.classList.add('is-visible');
      }

      function renderCurrent() {
        renderRecordOptions();
        renderChoiceControls();
        const painting = currentPainting();
        const enabled = paintings.length > 0 && Boolean(painting);

        setEnabled(enabled);
        els.saveFileBtn.disabled = !paintings.length;
        els.downloadFileBtn.disabled = !paintings.length;
        els.newBtn.disabled = !paintings.length;

        if (!enabled) {
          writeFieldValues({});
          renderPreview(null);
          els.recordTitle.textContent = paintings.length ? 'Nessun risultato' : 'Nessun record';
          els.recordMeta.textContent = paintings.length ? `0 / ${paintings.length}` : '0 / 0';
          return;
        }

        writeFieldValues(core.paintingToFormValues(painting));
        renderPreview(painting);

        const visiblePosition = visibleIndexes.indexOf(currentIndex);
        els.recordTitle.textContent = painting.title.it || '(senza titolo)';
        els.recordMeta.textContent = `${visiblePosition + 1} / ${visibleIndexes.length} - ID ${painting.id || '?'}`;
        els.recordSelect.value = String(currentIndex);
      }

      function selectIndex(index) {
        currentIndex = index;
        renderCurrent();
      }

      function navigate(delta) {
        if (!visibleIndexes.length) {
          return;
        }
        const visiblePosition = visibleIndexes.indexOf(currentIndex);
        const nextVisiblePosition = core.moveIndex(visiblePosition < 0 ? null : visiblePosition, delta, visibleIndexes.length);
        selectIndex(visibleIndexes[nextVisiblePosition]);
      }

      function loadJsonText(text, loadedFileName, handle) {
        const data = JSON.parse(text);
        if (!Array.isArray(data)) {
          throw new Error('Il JSON deve essere un array.');
        }

        paintings = data.map((painting) => core.normalizePainting(painting));
        currentIndex = paintings.length ? 0 : -1;
        fileHandle = handle || null;
        fileName = loadedFileName || 'Paintings.json';
        els.searchInput.value = '';
        renderValidation([]);
        renderCurrent();
        setDirty(false);
      }

      async function openWithPicker() {
        if (!window.showOpenFilePicker) {
          els.fileInput.click();
          return;
        }

        try {
          const handles = await window.showOpenFilePicker({
            multiple: false,
            types: [
              {
                description: 'JSON',
                accept: { 'application/json': ['.json'] },
              },
            ],
          });
          const handle = handles[0];
          const file = await handle.getFile();
          loadJsonText(await file.text(), file.name, handle);
        } catch (error) {
          if (error.name !== 'AbortError') {
            setStatus(`Errore apertura file: ${error.message}`, true);
          }
        }
      }

      async function saveJson(preferDownload) {
        if (!paintings.length) {
          return;
        }
        applyCurrentForm();

        const errors = core.validatePaintingsForSave(paintings);
        renderValidation(errors);
        if (errors.length) {
          setStatus('Salvataggio bloccato: ci sono errori nel JSON.', true);
          return;
        }

        const json = core.serializePaintings(paintings);

        if (!preferDownload && fileHandle && fileHandle.createWritable) {
          try {
            const writable = await fileHandle.createWritable();
            await writable.write(json);
            await writable.close();
            setDirty(false);
            setStatus(`${fileName} salvato.`);
            return;
          } catch (error) {
            setStatus(`Scrittura diretta non riuscita: ${error.message}. Scarico una copia.`, true);
          }
        }

        downloadJson(json);
        setDirty(false);
        setStatus(`${fileName} pronto come download.`);
      }

      function downloadJson(json) {
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = fileName || 'Paintings.json';
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      }

      function addPainting(source) {
        const painting = source ? core.normalizePainting(source) : core.createEmptyPainting(paintings);
        if (source) {
          painting.id = core.nextPaintingId(paintings);
        }
        paintings.push(painting);
        currentIndex = paintings.length - 1;
        els.searchInput.value = '';
        renderCurrent();
        setDirty(true);
      }

      function deleteCurrentPainting() {
        const painting = currentPainting();
        if (!painting) {
          return;
        }
        const title = painting.title.it || `ID ${painting.id || '?'}`;
        if (!window.confirm(`Eliminare "${title}"?`)) {
          return;
        }

        paintings.splice(currentIndex, 1);
        currentIndex = Math.min(currentIndex, paintings.length - 1);
        renderCurrent();
        setDirty(true);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      els.openFileBtn.addEventListener('click', openWithPicker);

      els.fileInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) {
          return;
        }
        try {
          loadJsonText(await file.text(), file.name, null);
          event.target.value = '';
        } catch (error) {
          setStatus(`Errore lettura JSON: ${error.message}`, true);
        }
      });

      els.saveFileBtn.addEventListener('click', () => saveJson(false));
      els.downloadFileBtn.addEventListener('click', () => saveJson(true));
      els.newBtn.addEventListener('click', () => addPainting(null));
      els.duplicateBtn.addEventListener('click', () => addPainting(currentPainting()));
      els.deleteBtn.addEventListener('click', deleteCurrentPainting);
      els.prevBtn.addEventListener('click', () => navigate(-1));
      els.nextBtn.addEventListener('click', () => navigate(1));

      els.recordSelect.addEventListener('change', () => {
        selectIndex(Number(els.recordSelect.value));
      });

      els.searchInput.addEventListener('input', () => {
        renderCurrent();
      });

      function handleFormEdit(event) {
        if (rendering || !event.target.name) {
          return;
        }
        applyCurrentForm();
        const painting = currentPainting();
        if (event.target.name === 'image') {
          renderPreview(painting);
        }
        if (['dimensions', 'image', 'techniqueIt', 'techniqueEn'].includes(event.target.name)) {
          renderChoiceControls();
        }
        if (['id', 'titleIt', 'category'].includes(event.target.name)) {
          renderRecordOptions();
          els.recordTitle.textContent = painting.title.it || '(senza titolo)';
          els.recordMeta.textContent = `${visibleIndexes.indexOf(currentIndex) + 1} / ${visibleIndexes.length} - ID ${painting.id || '?'}`;
        }
      }

      els.editorForm.addEventListener('input', handleFormEdit);
      els.editorForm.addEventListener('change', handleFormEdit);

      document.addEventListener('keydown', (event) => {
        const tagName = event.target.tagName;
        const isEditing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tagName);

        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
          event.preventDefault();
          saveJson(false);
          return;
        }

        if (!isEditing && event.key === 'ArrowLeft') {
          navigate(-1);
        }
        if (!isEditing && event.key === 'ArrowRight') {
          navigate(1);
        }
      });
    </script>
  </body>
</html>
